<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Local Farmers Marketplace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(244, 248, 241, 0.92),
                    rgba(244, 248, 241, 0.92)
                ),
                url("https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 45px;
            margin-bottom: 5px;
        }

        .title {
            color: #2e7d32;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;

            font-size: 15px;

            margin-bottom: 22px;

            line-height: 1.5;
        }

        /* Login Error Message */

        .error-message {
            background: #ffebee;

            color: #c62828;

            border: 1px solid #ef9a9a;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 20px;

            text-align: left;
        }

        .form-group {
            text-align: left;

            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: #333;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #43a047;
        }


        /* Password Field */

        .password-container {
            position: relative;

            width: 100%;
        }

        .password-container input {
            padding-right: 48px;
        }

        .toggle-password {

            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 19px;

            padding: 0;
        }

        .toggle-password:hover {
            transform: translateY(-50%) scale(1.08);
        }


        /* Forgot Password */

        .forgot-password {

            display: block;

            text-align: right;

            margin-top: 8px;

            color: #2e7d32;

            text-decoration: none;

            font-size: 14px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }


        /* Login Button */

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #43a047;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        .login-button:hover {
            background: #2e7d32;
        }


        /* Register Section */

        .register-section {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;
        }

        .register-section p {

            color: #666;

            margin-bottom: 12px;
        }

        .register-button {

            display: inline-block;

            padding: 11px 28px;

            border-radius: 8px;

            background: #e8f5e9;

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }

        .register-button:hover {
            background: #c8e6c9;
        }


        /* Home Link */

        .home-link {

            display: block;

            margin-top: 20px;

            color: #2e7d32;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            text-decoration: underline;
        }


        /* Mobile */

        @media (max-width: 500px) {

            .login-card {
                padding: 30px 22px;
            }

            .title {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="login-card">


        <!-- Logo -->

        <div class="logo">
            🌱
        </div>


        <!-- Title -->

        <h1 class="title">
            Welcome Back!
        </h1>


        <!-- Subtitle -->

        <p class="subtitle">
            Login to your Local Farmers Marketplace account.
        </p>


        <!-- Login Error Message -->

        {% if error %}

            <div class="error-message">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <!-- Login Form -->

        <form method="POST">


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    📧 Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    🔐 Password
                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        id="toggleButton"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <!-- Forgot Password -->

                <a
                    href="#"
                    class="forgot-password"
                >
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-button"
            >
                🔐 Login
            </button>


        </form>


        <!-- Register Section -->

        <div class="register-section">

            <p>
                Don't have an account?
            </p>


            <a
                href="/register"
                class="register-button"
            >
                🌱 Create Account
            </a>

        </div>


        <!-- Home -->

        <a
            href="/"
            class="home-link"
        >
            ← Back to Home
        </a>


    </div>


    <!-- Show / Hide Password -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const toggleButton =
                document.getElementById("toggleButton");


            if (password.type === "password") {

                password.type = "text";

                toggleButton.textContent = "🙈";

                toggleButton.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                password.type = "password";

                toggleButton.textContent = "👁️";

                toggleButton.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }

    </script>


</body>

</html>
