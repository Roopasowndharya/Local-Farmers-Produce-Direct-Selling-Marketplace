<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(244, 248, 241, 0.92),
                    rgba(244, 248, 241, 0.92)
                ),
                url("https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .success-card {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 45px 35px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #2e7d32;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .message {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .login-button {
            display: inline-block;

            background: #43a047;
            color: white;

            padding: 13px 30px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;

            margin: 5px;
        }

        .login-button:hover {
            background: #2e7d32;
        }

        .home-button {
            display: inline-block;

            background: #e8f5e9;
            color: #2e7d32;

            padding: 13px 30px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;

            margin: 5px;
        }

        .home-button:hover {
            background: #c8e6c9;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            🎉
        </div>

        <h1>
            Registration Successful!
        </h1>

        <p class="message">
            Your account has been created successfully.
            Welcome to the Local Farmers Marketplace!
            You can now login to continue.
        </p>

        <a href="/login" class="login-button">
            🔐 Login Now
        </a>

        <a href="/" class="home-button">
            🏠 Back to Home
        </a>

    </div>

</body>

</html>
