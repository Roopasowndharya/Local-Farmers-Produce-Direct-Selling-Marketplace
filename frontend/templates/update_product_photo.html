<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Product Photo</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(32, 78, 43, 0.75),
                    rgba(32, 78, 43, 0.75)
                ),
                url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }

        .card {
            width: 90%;
            max-width: 500px;

            background: white;
            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            color: #2f6b3f;
            margin-bottom: 10px;
        }

        p {
            color: #687468;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 2px dashed #9bb49e;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #f7faf6;
        }

        .update-btn {
            width: 100%;
            border: none;
            padding: 13px;

            background: #2f6b3f;
            color: white;

            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .update-btn:hover {
            background: #245431;
        }

        .back-btn {
            display: block;
            margin-top: 15px;

            color: #2f6b3f;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        📷
    </div>


    <h1>
        Update Product Photo
    </h1>


    <p>
        Choose a new photo for this product.
        Use a clear image so customers can easily
        identify the fresh produce.
    </p>


    <form
        method="POST"
        enctype="multipart/form-data"
    >


        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >


        <button
            type="submit"
            class="update-btn"
        >
            Update Photo
        </button>


    </form>


    <a
        href="{{ url_for('my_products_page') }}"
        class="back-btn"
    >
        ← Back to My Products
    </a>


</div>


</body>

</html>
